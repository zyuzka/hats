name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads this checkout: they build, test and lint, and write nothing back.
# Without this block the token arrives with whatever the repository default grants,
# which is how a workflow ends up able to push or comment by accident.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      # The whole history and the tags: changelog-check reads every version Build/build-app.sh
      # has ever stamped, and plugin-version-check compares plugin/ with the last v* tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # HATS_STATE_HOME is not optional. Without it the suite reaches the real state
      # directory: it would mix test events into the operations log and perform the
      # first-run adoption of an older install ahead of the app. HOME does not help —
      # NSHomeDirectory() ignores it, which is why this variable exists at all.
      - name: Test
        run: HATS_STATE_HOME="$(mktemp -d)" swift test

      # The bundle stamps a version and the app shows CHANGELOG.md to whoever installs
      # it, so a version with no entry reads as a version that changed nothing.
      - name: Every version ever stamped is described
        run: ./Dev/changelog-check.sh

      - name: Signing identity choice
        run: bash Dev/signing-identity.test.sh

      - name: Gateway session probe of the build
        run: bash Dev/gateway-session-probe.test.sh

      - name: Plugin version check
        run: bash Dev/plugin-version-check.test.sh

      # Only on the release pull request into main: develop collects plugin changes between
      # releases, and the number is raised once for the release that carries them.
      - name: Plugin version is raised for the release
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: ./Dev/plugin-version-check.sh

  lint:
    runs-on: macos-15
    # Blocking since AccountStore.swift was split: swiftlint exits 0 here, so anything
    # that turns it red is new. Warnings still ride along without failing the job —
    # only error-severity rules stop it.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --reporter github-actions-logging

  plugin-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: GNU timeout for the plugin tests
        run: command -v timeout || brew install coreutils

      - name: Handoff hook
        run: |
          python3 --version
          bash plugin/tests/handoff.test.sh

      - name: Anchor reminder hook
        run: bash plugin/tests/anchor-nudge.test.sh

      - name: Python launcher
        run: bash plugin/tests/py.test.sh

      - name: Own anchor steps
        run: bash plugin/tests/anchor-steps.test.sh

      - name: Session window fill hook
        run: bash plugin/tests/window-fill.test.sh

      - name: Stop snapshot hook
        run: bash plugin/tests/stop-snapshot.test.sh

      - name: Keychain item name of the mod
        run: bash plugin/tests/credential-services.test.sh

      - name: Limit waiting event of the mod
        run: bash plugin/tests/stage-limit-waiting.test.sh

      # The mod tests run under Claude Code's own runner. No sign-in is needed: with an empty
      # HOME and CLAUDE_CONFIG_DIR it passed all its tests on 2026-11-19. The version is pinned,
      # the one the tests were last run with.
      - name: Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.328
          claude --version

      - name: Mod tests
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude plugin test plugin

      - name: Mod as claude plugin validate sees it
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          bash plugin/tests/mod-validate.test.sh

      - name: Plugin tests under the system Python
        run: |
          export PATH="/usr/bin:$PATH"
          python3 --version
          bash plugin/tests/handoff.test.sh
          bash plugin/tests/anchor-nudge.test.sh
          bash plugin/tests/anchor-steps.test.sh
          bash plugin/tests/window-fill.test.sh
          bash plugin/tests/stop-snapshot.test.sh
          bash plugin/tests/credential-services.test.sh
          bash plugin/tests/stage-limit-waiting.test.sh
